# 依赖服务: qdrant + nacos
# mysql / redis / nginx 由宿主/外部直接安装,不纳入容器编排。
#
# 启动: docker compose -f docker/server/docker-compose.yml up -d
#
# 网络:
#   - 服务跑在 fitness-infra 桥接网络,与 fitness-admin-app 共用同一网络即可互通
#   - mysql/redis 走宿主机地址访问,不在本编排内

services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: fitness-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/opt/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yml:ro
    networks:
      - fitness-infra

  # Nacos 配置中心(standalone 模式,本地开发/单机部署)
  # 控制台: http://<host>:8848/nacos
  # 默认账号 nacos/nacos,首次部署后请:
  #   1. 浏览器登录控制台
  #   2. 权限控制 → 用户管理 → 编辑 nacos 用户 → 改密码为 NACOS_PASSWORD(env 变量)的值
  #   3. 在「命名空间」新建 namespace ID = NACOS_NAMESPACE(env 变量)的值(默认 fitness-admin)
  #   4. 在该 namespace 下新建配置 dataId=fitness-admin-ai.yaml, group=DEFAULT_GROUP, 格式 YAML
  #
  # 鉴权配置:
  #   - NACOS_AUTH_ENABLE=true 开启鉴权(Open API 必须带 username/password)
  #   - NACOS_TOKEN_SECRET_KEY 用于签 JWT,长度 >= 32 字节,生产请用强随机值
  #   - IDENTITY_KEY / IDENTITY_VALUE 是 Nacos 节点间通信用的 server identity,任意 16+ 字符
  #   - 密码在控制台改,env 留空占位,改完手动同步到 fitness-admin.env
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: fitness-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    # === 鉴权(2026-06-19 启用) ===
    # 真实 IDENTITY/TOKEN 不写在 compose 文件里,只从 env_file 读。
    # 服务器上 /opt/fitness-admin/fitness-admin.env 配好 NACOS_* 变量后,
    # docker compose up -d 时 nacos 容器会自动读取。
    #
    # 路径说明: docker compose v2.x 的 env_file 相对当前工作目录。
    # 部署时 cd /opt/fitness-admin/docker/server 再执行 docker compose,
    # 这里用 ../../fitness-admin.env 解析为 /opt/fitness-admin/fitness-admin.env。
    env_file:
      - /opt/fitness-admin/fitness-admin.env
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - SPRING_DATASOURCE_PLATFORM=derby
      # NACOS_AUTH_ENABLE / NACOS_AUTH_TOKEN / NACOS_AUTH_IDENTITY_KEY / NACOS_AUTH_IDENTITY_VALUE
      # 均由 env_file 注入容器,无需在此用 ${} 插值(插值会读 Compose 自身的 .env,导致 "not set" 警告)。
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - fitness-infra

volumes:
  qdrant_storage:
  nacos_data:
  nacos_logs:

networks:
  fitness-infra:
    driver: bridge
