services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: fitness-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/opt/qdrant/storage
      - ./config.yaml:/qdrant/config/production.yml:ro

volumes:
  qdrant_storage:
