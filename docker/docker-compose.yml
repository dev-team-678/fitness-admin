# 入口服务编排: 仅 fitness-admin 后端
#
# 设计:
#   - mysql / redis / nginx 由宿主直接安装(apt/yum/手动),不纳入容器编排
#   - qdrant / nacos 在 fitness-admin/docker/server/docker-compose.yml 起
#   - 宿主机内网互通:容器里访问 mysql/redis 用 host.docker.internal(Mac/Win)
#     或宿主机实际 IP(生产 Linux)
#
# 启动顺序建议:
#   1. docker compose -f docker/server/docker-compose.yml up -d   # 起 nacos + qdrant
#   2. 启动 mysql/redis/nginx(宿主服务)
#   3. docker compose -f docker/docker-compose.yml up -d --build  # 起 fitness-admin
#
# 网络:
#   - 与 nacos/qdrant 共用 fitness-infra 网络
#   - 当前编排默认新建 fitness-network,如需与基础设施网络互通:
#       network_mode: bridge  +  改 MYSQL_HOST/REDIS_HOST 为宿主机 IP
#     或在两侧都 external: true 引用同一外部网络。

version: '3.8'

services:
  fitness-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fitness-admin
    ports:
      - "8080:8080"
    env_file:
      - ../deploy/fitness-admin.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # mysql/redis 走宿主机本地地址;容器中访问宿主机用 host.docker.internal
      # Linux 生产环境改成宿主实际内网 IP,例如 192.168.1.10
      - MYSQL_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      # nacos 在另一个 compose 编排里,走 docker 内网 DNS,容器名 nacos
      - NACOS_SERVER=nacos:8848
    extra_hosts:
      # 兼容 Linux 容器访问宿主机:Mac/Win 上 docker for desktop 已自带 host.docker.internal
      # Linux 上需要这条才会把 host.docker.internal 解析到 172.17.0.1
      - "host.docker.internal:host-gateway"
    networks:
      - fitness-network
      - fitness-infra
    depends_on:
      - nacos
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  fitness-network:
    driver: bridge
  # 引用 docker/server/docker-compose.yml 中定义的外部网络,让容器能解析 nacos / qdrant
  fitness-infra:
    external: true
    name: fitness-infra