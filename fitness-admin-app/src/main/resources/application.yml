server:
  port: 8080
  # === HTTPS 强化 (2026-06-20 P2-12) ===
  # 反向代理后端:信任 nginx 转发的 X-Forwarded-* 头,避免 redirect 后丢失 https scheme
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: "127\\.0\\.0\\.1,10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3},172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3},192\\.168\\.\\d{1,3}\\.\\d{1,3}"

spring:
  application:
    name: fitness-admin
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:fitness}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
    schemas: ${MYSQL_DB:fitness}
    validate-on-migrate: false
    clean-disabled: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fitness.admin.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true
  token-prefix: Bearer

knife4j:
  enable: true
  openapi:
    title: 运动健身助手管理后台API
    description: 运动健身助手管理后台后端服务接口文档
    version: v1.0.0
    contact:
      name: Fitness Admin
    servers:
      - url: http://localhost:8080
        description: 本地环境

logging:
  level:
    com.fitness.admin: debug
    org.springframework.security: debug

qiniu:
  access-key: ${QINIU_ACCESS_KEY:}
  secret-key: ${QINIU_SECRET_KEY:}
  bucket: ${QINIU_BUCKET:}
  domain: ${QINIU_DOMAIN:}
  upload-domain: ${QINIU_UPLOAD_DOMAIN:https://upload-z2.qiniup.com}

# AI 业务配置已迁移至 Nacos, dataId = fitness-admin-ai.yaml, group = DEFAULT_GROUP, namespace = fitness-admin。
# 本地无 Nacos 时的兜底默认值(只用于本地开发离线启动);生产环境必须以 Nacos 为准。
#
# === Jasypt 加密 .env 中的 API Key (2026-06-20 P2-10) ===
# 启用 Jasypt 后, .env / application.yml 中形如 "ENC(xxx)" 的字符串会被自动解密。
# 解密密钥通过环境变量 JASYPT_ENCRYPTOR_PASSWORD 注入,不进仓库 / 不进 Nacos。
#   生成加密值: java -cp jasypt-3.0.5.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI \
#               input="sk-RxSKT..." password=<password> algorithm=PBEWithMD5AndDES
#   部署: 在 /opt/fitness-admin/fitness-admin.env 中 export JASYPT_ENCRYPTOR_PASSWORD=<password>
# 注意: Nacos 中的 fitness-admin-ai.yaml 走 Nacos 自身 AES 落盘加密 (P1-5),
#       Jasypt 只针对本地兜底(无 Nacos 时)的 API Key。
jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator
    property:
      prefix: ENC(
      suffix: )
ai:
  provider: ${AI_PROVIDER:openai}
  api-key: ${AI_API_KEY:}
  api-base-url: ${AI_API_BASE_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-3.5-turbo}
  max-tokens: ${AI_MAX_TOKENS:2000}
  temperature: ${AI_TEMPERATURE:0.7}
  chat-history-limit: ${AI_CHAT_HISTORY_LIMIT:6}
  async-chat-enabled: ${AI_ASYNC_CHAT_ENABLED:true}
  async-chat-timeout-seconds: ${AI_ASYNC_CHAT_TIMEOUT_SECONDS:90}
  embedding-api-base-url: ${AI_EMBEDDING_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  embedding-api-key: ${AI_EMBEDDING_API_KEY:}
  embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
  embedding-dimension: ${AI_EMBEDDING_DIMENSION:1024}
  qdrant-url: ${QDRANT_URL:localhost:6334}
  qdrant-api-key: ${QDRANT_API_KEY:}
  qdrant-collection: ${QDRANT_COLLECTION:fitness_knowledge}
  rag-top-k: ${AI_RAG_TOP_K:5}
  rag-min-score: ${AI_RAG_MIN_SCORE:0.6}
  chunk-size: ${AI_CHUNK_SIZE:500}
  chunk-overlap: ${AI_CHUNK_OVERLAP:50}
  rag-rerank-enabled: false
  rag-knowledge-sources: []
  daily-chat-limit: 100
  daily-plan-limit: 10
  max-tokens-per-day: 0
  concurrency-limit: 10

# Actuator + Micrometer Prometheus 指标
management:
  endpoints:
    web:
      exposure:
        # === HTTPS 强化 (2026-06-20 P2-12) ===
        # 不暴露 env / configprops / heapdump / threaddump 等敏感端点,防止泄露 API Key
        # 如需临时开启,改用 management.endpoint.<id>.enabled=true 单独控制
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      # show-components 控制 /actuator/health 是否列出各组件,生产设为 never 更安全
      show-components: when-authorized
    prometheus:
      access: read_only
  # 禁用内置 metrics 中可能包含敏感信息的端点
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
