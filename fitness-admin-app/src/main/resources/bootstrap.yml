spring:
  application:
    name: fitness-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:fitness-admin}
        # Nacos 未启用鉴权时(默认),不传 username/password 避免 Nacos 拒绝空凭据
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
        extension-configs:
          - data-id: fitness-admin-ai.yaml
            group: DEFAULT_GROUP
            refresh: true
